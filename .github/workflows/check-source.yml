name: check-source

on:
  schedule:
    - cron: "0 15 1 * *" # monthly, day 1, 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare the pages with the stored hashes
        id: check
        run: |
          set +e
          bash scripts/check_source.sh > result.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt

      - name: Open an issue if a page changed
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-changed --color FBCA04 \
            --description "Anthropic docs changed" 2>/dev/null || true
          if [ -z "$(gh issue list --label source-changed --state open --json number --jq '.[].number')" ]; then
            {
              echo "Pages watched by this repo (CHANGED or NEW need review):"
              echo
              sed 's/^/- /' result.txt
              echo
              echo "Review the CHANGED pages, update choosing-a-model/references/models.md and its last-verified dates, run \`bash scripts/check_source.sh update\`, commit, and close this issue."
            } > body.md
            gh issue create --label source-changed \
              --title "Anthropic docs changed" --body-file body.md
          fi

      - name: Fail if the check itself broke
        if: steps.check.outputs.code != '0' && steps.check.outputs.code != '1'
        run: |
          echo "check_source.sh failed with code ${{ steps.check.outputs.code }}"
          exit 1
